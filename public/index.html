<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SecureDocs · TechCorp</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/estilos.css" />
  </head>
  <body>
    <div id="app" class="app sin-sesion">
      <aside id="lateral" class="lateral" aria-label="Navegación principal">
        <div class="lateral-marca">
          <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
          <span>SecureDocs</span>
          <small>TechCorp S.A.</small>
        </div>
        <nav id="menu" class="lateral-nav"></nav>
        <div class="lateral-pie">
          <span id="salud" class="salud" title="Estado de la API y de la base de datos"></span>
          <span class="lateral-version">Laboratorio 06 · Cloud Security</span>
        </div>
      </aside>

      <div class="principal">
        <header class="barra">
          <button id="btn-menu" type="button" class="btn btn-icono barra-menu" aria-label="Abrir el menú"><i class="bi bi-list" aria-hidden="true"></i></button>
          <h1 id="titulo-pagina" class="barra-titulo"></h1>
          <div class="barra-acciones">
            <button id="btn-entorno" type="button" class="pill" title="Entorno simulado: ubicación, dispositivo y hora"></button>
            <button id="btn-tema" type="button" class="btn btn-icono" aria-label="Cambiar el tema"></button>
            <button id="btn-usuario" type="button" class="usuario-chip" aria-haspopup="menu"></button>
          </div>
        </header>
        <main class="contenido">
          <div id="avisos" role="status" aria-live="polite"></div>
          <div id="vista"></div>
        </main>
      </div>
    </div>

    <div id="fondo-lateral" class="fondo-lateral"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <noscript>SecureDocs necesita JavaScript para funcionar.</noscript>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
